<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar_bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow_grad" x1="100" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="face_grad" x1="150" y1="120" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="200" fill="url(#avatar_bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="200" cy="200" r="185" stroke="url(#glow_grad)" stroke-width="3" opacity="0.6" stroke-dasharray="12 8"/>
  
  <!-- Stylized Developer Silhouette & Monogram -->
  <circle cx="200" cy="150" r="65" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <path d="M90 350 C 90 260, 140 230, 200 230 C 260 230, 310 260, 310 350 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Sleek Glasses / Modern Visor -->
  <rect x="155" y="135" width="90" height="24" rx="6" fill="#0F172A" stroke="url(#glow_grad)" stroke-width="2"/>
  <circle cx="178" cy="147" r="5" fill="#38BDF8"/>
  <circle cx="222" cy="147" r="5" fill="#6366F1"/>

  <!-- Code Monogram Badge -->
  <rect x="145" y="275" width="110" height="34" rx="8" fill="#0A0F1D" stroke="url(#glow_grad)" stroke-width="1.5"/>
  <text x="200" y="298" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">YASH.DEV</text>

  <!-- Live Pulse Dot -->
  <circle cx="290" cy="110" r="8" fill="#10B981"/>
  <circle cx="290" cy="110" r="14" stroke="#10B981" stroke-width="2" opacity="0.5"/>
</svg>
