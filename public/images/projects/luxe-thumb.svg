<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0A0D14"/>
  <circle cx="500" cy="200" r="240" fill="url(#luxe_glow)" opacity="0.35"/>
  
  <!-- Architectural grid -->
  <path d="M50 0V450M150 0V450M250 0V450M350 0V450M450 0V450M550 0V450M650 0V450M750 0V450" stroke="#1E293B" stroke-width="0.8" opacity="0.2"/>
  
  <!-- Luxe Card -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#111622" stroke="#2D3748" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="70" y="50" width="660" height="48" rx="16" fill="#161E2E"/>
  <text x="100" y="80" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">LUXE ESTATES</text>
  <text x="540" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Villas &bull; Penthouses &bull; Islands</text>
  
  <!-- Left Property Showcase -->
  <rect x="100" y="120" width="340" height="250" rx="12" fill="#1B2333" stroke="#2D3748"/>
  <rect x="120" y="140" width="300" height="150" rx="8" fill="#243048"/>
  <!-- Villa Silhouette -->
  <path d="M140 250 L200 180 L280 180 L340 220 L380 250 Z" fill="#3B82F6" opacity="0.3"/>
  <rect x="210" y="190" width="100" height="60" fill="#1E293B"/>
  <circle cx="350" cy="170" r="18" fill="#F59E0B" opacity="0.6"/>
  <text x="130" y="315" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">The Obsidian Villa, Palm Jumeirah</text>
  <text x="130" y="345" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">$18,450,000</text>
  <text x="250" y="345" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">6 Beds &bull; 8 Baths &bull; 11,200 sqft</text>

  <!-- Right Concierge Card -->
  <rect x="460" y="120" width="240" height="250" rx="12" fill="#151C2A" stroke="#28354D"/>
  <text x="480" y="150" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">VIP Private Tour</text>
  <text x="480" y="175" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Schedule your private helicopter or chauffeur preview.</text>
  
  <rect x="480" y="205" width="200" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="495" y="228" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Select Date & Time</text>

  <rect x="480" y="250" width="200" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="495" y="273" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Contact / WhatsApp</text>

  <rect x="480" y="300" width="200" height="44" rx="8" fill="#2563EB"/>
  <text x="580" y="328" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Book Exclusive Viewing &rarr;</text>

  <defs>
    <radialGradient id="luxe_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
