<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0D0F17"/>
  <!-- Ambient glow -->
  <circle cx="400" cy="200" r="220" fill="url(#nexus_glow)" opacity="0.4"/>
  <!-- Grid lines -->
  <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- Dashboard Card Window -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="#131722" stroke="#2A334B" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="44" rx="16" fill="#1A2030"/>
  <circle cx="110" cy="82" r="5" fill="#EF4444"/>
  <circle cx="126" cy="82" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="82" r="5" fill="#10B981"/>
  <rect x="260" y="73" width="280" height="18" rx="6" fill="#0D111A" stroke="#252F48"/>
  <text x="400" y="86" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">nexus-ai.platform/analytics</text>

  <!-- Metric Badges -->
  <rect x="110" y="125" width="170" height="70" rx="10" fill="#1A2234" stroke="#2D3A56"/>
