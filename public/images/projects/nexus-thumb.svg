  <text x="125" y="178" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1.42M req/s</text>
  <text x="235" y="178" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+18.4%</text>

  <rect x="295" y="125" width="170" height="70" rx="10" fill="#1A2234" stroke="#2D3A56"/>
  <text x="310" y="148" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">AI Anomalies Fixed</text>
  <text x="310" y="178" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">99.98%</text>
  <text x="420" y="178" fill="#6366F1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Auto</text>

  <rect x="480" y="125" width="210" height="70" rx="10" fill="#1A2234" stroke="#2D3A56"/>
  <text x="495" y="148" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Avg Response Latency</text>
  <text x="495" y="178" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">62ms</text>
  <text x="635" y="178" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">-14ms</text>

  <!-- Dynamic Wave Chart -->
  <path d="M110 330 C 180 320, 220 250, 280 270 C 340 290, 380 220, 440 240 C 500 260, 560 200, 620 220 C 660 230, 680 210, 690 205" fill="none" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 330 C 180 320, 220 250, 280 270 C 340 290, 380 220, 440 240 C 500 260, 560 200, 620 220 C 660 230, 680 210, 690 205 L690 350 L110 350 Z" fill="url(#chart_gradient)" opacity="0.25"/>

  <!-- AI Insight Banner -->
  <rect x="110" y="320" width="580" height="50" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1.2"/>
  <circle cx="135" cy="345" r="8" fill="#6366F1"/>
  <path d="M132 345L134 347L138 343" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="155" y="349" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="12" font-weight="500">AI Summary: Conversion funnel up 24% after Next.js 15 Server Component migration.</text>

  <defs>
    <radialGradient id="nexus_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chart_gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
