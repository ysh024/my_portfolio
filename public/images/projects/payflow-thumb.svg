<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#090B10"/>
  <circle cx="400" cy="225" r="250" fill="url(#payflow_glow)" opacity="0.3"/>

  <!-- Main Card -->
  <rect x="120" y="60" width="560" height="330" rx="20" fill="#111622" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Header with Live Status -->
  <rect x="120" y="60" width="560" height="50" rx="20" fill="#182030"/>
  <text x="150" y="92" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">PayFlow &bull; Subscriptions &amp; UPI</text>
  <rect x="520" y="74" width="130" height="24" rx="12" fill="#064E3B" stroke="#059669"/>
  <circle cx="535" cy="86" r="4" fill="#34D399"/>
  <text x="548" y="90" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Webhooks: 100%</text>

  <!-- Left: Checkout Simulation -->
  <rect x="150" y="130" width="240" height="230" rx="12" fill="#171F2F" stroke="#2B3850"/>
  <text x="170" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Selected Plan</text>
  <text x="170" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Pro Developer tier</text>
  <text x="170" y="215" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">&#8377;2,499<tspan font-size="13" fill="#94A3B8">/month</tspan></text>
  
  <rect x="170" y="235" width="200" height="32" rx="6" fill="#202A3C"/>
  <text x="185" y="256" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">UPI ID / QR Code</text>
  
  <rect x="170" y="280" width="200" height="40" rx="8" fill="#10B981"/>
  <text x="270" y="305" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Verify &amp; Pay Now</text>

  <!-- Right: Automated Log Stream -->
  <rect x="410" y="130" width="240" height="230" rx="12" fill="#0D111A" stroke="#1E293B"/>
  <text x="430" y="160" fill="#64748B" font-family="monospace" font-size="11">[2026-03-30 11:20:01]</text>
  <text x="430" y="180" fill="#10B981" font-family="monospace" font-size="11">&check; Webhook received</text>
  <text x="430" y="200" fill="#38BDF8" font-family="monospace" font-size="11">&check; Razorpay HMAC verified</text>
  <text x="430" y="220" fill="#A855F7" font-family="monospace" font-size="11">&check; Resend Invoice PDF sent</text>
  <text x="430" y="240" fill="#F59E0B" font-family="monospace" font-size="11">&check; Supabase user updated</text>
  
  <rect x="430" y="270" width="200" height="60" rx="6" fill="#161E2E" stroke="#253046"/>
  <text x="445" y="295" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Zero duplicate charges</text>
  <text x="445" y="315" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Idempotency buffer active</text>

  <defs>
    <radialGradient id="payflow_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
